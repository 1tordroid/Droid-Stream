name: Nightly Build

on:
  schedule:
    # Runs at 12:00 AM India time (18:30 UTC of previous day)
    - cron: '30 18 * * *'
  # Optional: Allow manual trigger
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  check_for_changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check_changes
        run: |
          git fetch --tags

          # Get the latest nightly tag if it exists
          LATEST_NIGHTLY_TAG=$(git tag -l "nightly-*" | sort -r | head -n 1 || echo "")

          if [ -z "$LATEST_NIGHTLY_TAG" ]; then
            # No previous nightly tag, so we should build
            echo "No previous nightly build found. Proceeding with build."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if there are new commits since the last nightly tag
          COMMIT_COUNT=$(git rev-list --count $LATEST_NIGHTLY_TAG..HEAD)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since last nightly build. Skipping build."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found $COMMIT_COUNT new commits since last nightly build."

          # Build only when the app or its build inputs changed. android/ is
          # generated by prebuild, so the config, plugins, native sources,
          # patches and dependencies count as well.
          CHANGED_FILES=$(git diff --name-only $LATEST_NIGHTLY_TAG..HEAD)

          if echo "$CHANGED_FILES" | grep -q -E '^(src|native-src|plugins|patches|assets)/|^(app\.config\.js|package(-lock)?\.json|index\.js|babel\.config\.js|metro\.config\.js|tailwind\.config\.js|scripts/build-sandbox-runtime\.mjs)$'; then
            echo "App or build changes found. Proceeding with build."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No app or build changes since the last nightly. Skipping build."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  verify-android-manifests:
    needs: check_for_changes
    if: ${{ needs.check_for_changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [standalone, playstore]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate ${{ matrix.variant }} native project
        env:
          APP_VARIANT: ${{ matrix.variant }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify ${{ matrix.variant }} manifest policy
        env:
          APP_VARIANT: ${{ matrix.variant }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:processReleaseMainManifest
          MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          if grep -Eq 'MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|READ_MEDIA_VIDEO|WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            echo "Forbidden broad storage permission found in ${{ matrix.variant }} manifest"
            exit 1
          fi
          if [ "${{ matrix.variant }}" = "playstore" ]; then
            grep -q 'package="com.tordroid.droidstream.play"' "$MANIFEST"
            if grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
              echo "Installer permission found in Play Store manifest"
              exit 1
            fi
          else
            grep -q 'package="com.tordroid.droidstream"' "$MANIFEST"
          fi

  # Same build as release.yml (generated android/ project, release signing
  # through the MYAPP_UPLOAD_* variables), published as a pre-release.
  build-android:
    needs: [check_for_changes, verify-android-manifests]
    if: ${{ needs.check_for_changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The nightly environment holds the signing secrets.
    environment: nightly
    permissions:
      # Creating the nightly pre-release needs write access.
      contents: write
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Fails prebuild and Gradle instead of signing with the debug key. Set
      # on this job only: verify-android-manifests runs prebuild unsigned.
      RELEASE: '1'
      MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      PROXY_API_URL: ${{ secrets.PROXY_API_URL }}

    steps:
      - name: Checkout specific branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Get commit info
        shell: bash
        run: |
          # The release tag goes on the commit that was built, not on whatever
          # the default branch points at when the release is created.
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/[^a-zA-Z0-9 .,;:_()-]//g')" >> "$GITHUB_ENV"
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=%an)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=nightly-$(date -u '+%Y%m%d')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android CMake
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install 'cmake;3.22.1' && "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Android CMake installation failed after three attempts.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Load signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          export MYAPP_UPLOAD_STORE_FILE="$RUNNER_TEMP/droid-stream-release.keystore"
          printf 'MYAPP_UPLOAD_STORE_FILE=%s\n' "$MYAPP_UPLOAD_STORE_FILE" >> "$GITHUB_ENV"
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${MYAPP_UPLOAD_STORE_PASSWORD:-}" ] || [ -z "${MYAPP_UPLOAD_KEY_ALIAS:-}" ] || [ -z "${MYAPP_UPLOAD_KEY_PASSWORD:-}" ]; then
            echo 'Signing secrets are missing from the nightly environment.' >&2
            echo 'Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MYAPP_UPLOAD_STORE_FILE"
          chmod 600 "$MYAPP_UPLOAD_STORE_FILE"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npm run build:sandbox && npx expo prebuild --platform android --clean --no-install

      - name: Build the signed release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=1 --no-parallel --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Collect the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo 'Signed release APK was not produced.' >&2
            find android/app/build/outputs -name '*.apk' -print >&2 || true
            exit 1
          fi
          mkdir -p apks
          NAME="DroidStream-nightly-v${VERSION}-universal-${BUILD_DATE}.apk"
          cp "$APK" "apks/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "path=apks/$NAME" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git fetch --tags
          for TAG in $(git tag -l 'nightly-*'); do
            echo "Deleting nightly release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || git push --delete origin "$TAG" || true
          done

      - name: Create the nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.BUILD_SHA }}
          name: 'Nightly Build v${{ env.APP_VERSION }} (${{ env.BUILD_DATE }})'
          body: |
            > ⚠️ **NIGHTLY BUILD** ⚠️
            > Not recommended for regular users. Download version with latest tag not pre-release tag, for stable apk.
            > This is an automated nightly build and may contain bugs or incomplete features.

            **Version:** v${{ env.APP_VERSION }}
            **Build Date:** ${{ env.BUILD_DATE }}
            **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ env.BUILD_SHA }}) by ${{ env.COMMIT_AUTHOR }}
            **Commit Message:** ${{ env.COMMIT_MSG }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: true

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidStream-Nightly-v${{ env.APP_VERSION }}-${{ env.BUILD_DATE }}
          path: apks/*.apk
          if-no-files-found: error

      - name: Send Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo 'Discord webhook URL not set, skipping notification'
            exit 0
          fi
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
          APK_URL="${REPO_URL}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          DOWNLOADS="$(printf '• [📱 **Universal APK**](%s) - Works on phones and TVs\n\n[View all downloads on GitHub](%s)' "$APK_URL" "$RELEASE_URL")"
          # jq builds the JSON so commit text cannot break the payload.
          jq -n \
            --arg version "v${APP_VERSION} (Build #${GITHUB_RUN_NUMBER})" \
            --arg date "${BUILD_DATE} UTC" \
            --arg commit "[${COMMIT_HASH}](${REPO_URL}/commit/${BUILD_SHA}) by ${COMMIT_AUTHOR}" \
            --arg message "${COMMIT_MSG}" \
            --arg downloads "$DOWNLOADS" \
            --arg timestamp "$(date -u --iso-8601=seconds)" \
            --arg title "Droid Stream nightly v${APP_VERSION}" \
            '{embeds: [{
              title: $title,
              description: "A new nightly build of **Droid Stream** is ready for testing!",
              color: 3447003,
              fields: [
                {name: "Version", value: $version, inline: true},
                {name: "Build Date", value: $date, inline: true},
                {name: "Latest Commit", value: $commit, inline: false},
                {name: "Commit Message", value: $message, inline: false},
                {name: "Download", value: $downloads, inline: false}
              ],
              footer: {text: "⚠️ Nightly build - may contain bugs"},
              timestamp: $timestamp
            }]}' > discord_payload.json
          curl -sS -H 'Content-Type: application/json' -d @discord_payload.json "$DISCORD_WEBHOOK"
          echo 'Discord notification sent'

      - name: Remove signing file
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/droid-stream-release.keystore"
