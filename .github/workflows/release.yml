name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Fails prebuild and Gradle instead of signing with the debug key.
      RELEASE: '1'
      MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android CMake
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install 'cmake;3.22.1' && "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Android CMake installation failed after three attempts.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Load release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          export MYAPP_UPLOAD_STORE_FILE="$RUNNER_TEMP/droid-stream-release.keystore"
          printf 'MYAPP_UPLOAD_STORE_FILE=%s\n' "$MYAPP_UPLOAD_STORE_FILE" >> "$GITHUB_ENV"
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${MYAPP_UPLOAD_STORE_PASSWORD:-}" ] || [ -z "${MYAPP_UPLOAD_KEY_ALIAS:-}" ] || [ -z "${MYAPP_UPLOAD_KEY_PASSWORD:-}" ]; then
            echo 'Release signing secrets are missing.' >&2
            echo 'Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD.' >&2
            echo 'See README.md section "Release signing".' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MYAPP_UPLOAD_STORE_FILE"
          chmod 600 "$MYAPP_UPLOAD_STORE_FILE"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npm run build:sandbox && npx expo prebuild --platform android --clean --no-install

      - name: Build the signed release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=1 --no-parallel --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Collect the universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo 'Signed release APK was not produced.' >&2
            find android/app/build/outputs -name '*.apk' -print >&2 || true
            exit 1
          fi
          OUT="dist/DroidStream-universal-v${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built $OUT from $APK"

      - name: Take this version's notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="dist/release-notes.md"
          awk -v v="$VERSION" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "CHANGELOG.md has no section \"## $VERSION\". Add one before tagging." >&2
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Droid Stream ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Remove signing file
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/droid-stream-release.keystore"
