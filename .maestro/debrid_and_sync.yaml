appId: com.tordroid.droidstream
name: Debrid and watch sync screens open
tags: [settings, phone]
---
- runFlow: _launch.yaml
- tapOn: "Torrents"
- tapOn: "Debrid and cloud services"
- assertVisible: "Debrid and cloud"
- assertVisible: "TorBox"
- assertVisible: "PikPak"
- back
- tapOn: "Settings"
- tapOn: "Watch sync"
- assertVisible: "AniSkip for anime"
- assertVisible: "Trakt"
