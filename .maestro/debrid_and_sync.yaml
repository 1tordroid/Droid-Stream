appId: com.tordroid.droidstream
name: Debrid and watch sync screens open
tags: [settings, phone, ci]
---
- runFlow: _launch.yaml
- tapOn: "Torrents"
- tapOn: "Debrid & cloud"
- assertVisible: "Debrid and cloud"
- assertVisible: "TorBox"
- scrollUntilVisible:
    element: "PikPak"
    direction: DOWN
- assertVisible: "PikPak"
- back
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Watch sync"
    direction: DOWN
- tapOn: "Watch sync"
- assertVisible: "AniSkip for anime"
- assertVisible: "Trakt"
