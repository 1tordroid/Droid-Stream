appId: com.tordroid.droidstream
name: Every tab opens
tags: [smoke, phone, ci]
---
- runFlow: _launch.yaml
- tapOn: "Search"
- assertVisible: "Search"
- tapOn: "Torrents"
# First visit: a one-time tip about torrents and VPNs.
- runFlow:
    when:
      visible: "Torrents are not unblocked"
    commands:
      - tapOn: "Not now"
- assertVisible: "Find streams"
- tapOn: "Library"
- assertVisible: "Library"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Watch sync"
    direction: DOWN
- assertVisible: "Watch sync"
- takeScreenshot: tabs_settings
- tapOn: "Home"
